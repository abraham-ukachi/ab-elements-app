<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
<title id="t">AbDrawer scopes and sides</title>
<desc id="d">Three scopes: app (covers everything, here a bottom language drawer), main (clipped to the main layout, here from the top) and aside (clipped to the aside, here from the right). Below, the four sides: top, bottom, left, right.</desc>
