<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">Scroll spy with the main scroller as root</title>
<desc id="d">Sections inside the main content scroller are observed with the main scroller as IntersectionObserver root. The visible section, Usage, is marked active in the AbToc in the aside. Clicking a TOC item scrolls the main container, never the window.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D8B085"/></marker></defs>
<rect width="100%" height="100%" fill="#19120C"/>
<rect x="20" y="20" width="860" height="420" rx="12" fill="#241A12" stroke="#6B5346" stroke-width="2.5" opacity="1"/>
<rect x="40" y="40" width="520" height="380" rx="6" fill="#2C2118" stroke="#D9AB7F" stroke-width="2.5" opacity="1"/>
<text x="300" y="62" font-size="13" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#F4ECE5" text-anchor="middle" font-weight="bold">main content = IntersectionObserver root</text>
<text x="300" y="80" font-size="12" font-family="Roboto Mono,DejaVu Sans Mono,monospace" fill="#F4ECE5" text-anchor="middle" font-weight="normal">useAbPage().mainScrollElement</text>
<rect x="60" y="95" width="480" height="92" rx="6" fill="#19120C" stroke="#3A2C22" stroke-width="1.5" opacity="1"/>
<text x="80" y="123" font-size="12" font-family="Roboto Mono,DejaVu Sans Mono,monospace" fill="#F4ECE5" text-anchor="start" font-weight="normal">&lt;section id="install"&gt;</text>
<text x="80" y="145" font-size="11" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#B5A597" text-anchor="start" font-weight="normal">scroll-margin-top: 0 (no fixed bar to clear)</text>
<rect x="60" y="200" width="480" height="92" rx="6" fill="#19120C" stroke="#D8B085" stroke-width="3" opacity="1"/>
<text x="80" y="228" font-size="12" font-family="Roboto Mono,DejaVu Sans Mono,monospace" fill="#F4ECE5" text-anchor="start" font-weight="normal">&lt;section id="usage"&gt;</text>
<text x="80" y="250" font-size="11" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#B5A597" text-anchor="start" font-weight="normal">scroll-margin-top: 0 (no fixed bar to clear)</text>
<text x="80" y="274" font-size="12" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#D8B085" text-anchor="start" font-weight="bold">✓ intersecting → active</text>
<rect x="60" y="305" width="480" height="92" rx="6" fill="#19120C" stroke="#3A2C22" stroke-width="1.5" opacity="1"/>
<text x="80" y="333" font-size="12" font-family="Roboto Mono,DejaVu Sans Mono,monospace" fill="#F4ECE5" text-anchor="start" font-weight="normal">&lt;section id="api"&gt;</text>
<text x="80" y="355" font-size="11" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#B5A597" text-anchor="start" font-weight="normal">scroll-margin-top: 0 (no fixed bar to clear)</text>
<rect x="580" y="40" width="280" height="380" rx="6" fill="#2C2118" stroke="#6B5346" stroke-width="1.5" opacity="1"/>
<text x="720" y="62" font-size="13" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#F4ECE5" text-anchor="middle" font-weight="bold">aside · AbToc</text>
<rect x="600" y="80" width="240" height="34" rx="17" fill="#19120C" stroke="#3A2C22" stroke-width="1.5" opacity="1"/>
<text x="720" y="102" font-size="13" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#F4ECE5" text-anchor="middle" font-weight="normal">Install</text>
<rect x="600" y="124" width="240" height="34" rx="17" fill="#3A2C1F" stroke="#D8B085" stroke-width="1.5" opacity="1"/>
<text x="720" y="146" font-size="13" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#F3E6D8" text-anchor="middle" font-weight="normal">Usage ← active</text>
<rect x="600" y="168" width="240" height="34" rx="17" fill="#19120C" stroke="#3A2C22" stroke-width="1.5" opacity="1"/>
<text x="720" y="190" font-size="13" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#F4ECE5" text-anchor="middle" font-weight="normal">API</text>
<line x1="560" y1="245" x2="600" y2="147" stroke="#D8B085" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="720" y="260" font-size="12" font-family="Roboto Mono,DejaVu Sans Mono,monospace" fill="#F4ECE5" text-anchor="middle" font-weight="normal">click → scrollToAbSection(id,</text>
<text x="720" y="278" font-size="11" font-family="Roboto Mono,DejaVu Sans Mono,monospace" fill="#F4ECE5" text-anchor="middle" font-weight="normal">{ container: mainScrollElement })</text>
<text x="720" y="310" font-size="12" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#FFB4AB" text-anchor="middle" font-weight="bold">never window.scrollTo</text>
<text x="450" y="470" font-size="13" font-family="Roboto Mono,DejaVu Sans Mono,monospace" fill="#F4ECE5" text-anchor="middle" font-weight="normal">useAbScrollSpy(['install','usage','api'], { root: mainScrollElement })</text>
<text x="450" y="495" font-size="12" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#B5A597" text-anchor="middle" font-weight="normal">The window never scrolls, so a window-based spy would never fire. Always pass the main scroller.</text>
</svg>
