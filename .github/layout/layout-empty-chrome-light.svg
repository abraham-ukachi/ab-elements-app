<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
<title id="t">Empty header, footer and bars take no space</title>
<desc id="d">Left: a layout with header, mainHeader and mainBar filled. Right: the same layout with them empty; they are not rendered and measure 0px, so main content takes all the space.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A67C52"/></marker></defs>
<rect width="100%" height="100%" fill="#FFF8F5"/>
<text x="225" y="40" font-size="16" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#211A16" text-anchor="middle" font-weight="bold">With content</text>
<rect x="20" y="55" width="410" height="380" rx="10" fill="#FFFFFF" stroke="#C4B2A4" stroke-width="2.5" opacity="1"/>
<rect x="30" y="65" width="390" height="36" rx="6" fill="#FFF8F5" stroke="#8A6440" stroke-width="1.5" stroke-dasharray="6 4" opacity="1"/>
<text x="225.0" y="88.0" font-size="13" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#211A16" text-anchor="middle" font-weight="bold">header (has content)</text>
<rect x="40" y="111" width="370" height="30" rx="6" fill="#FFF8F5" stroke="#8A6440" stroke-width="1.5" stroke-dasharray="6 4" opacity="1"/>
<text x="225.0" y="131.0" font-size="13" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#211A16" text-anchor="middle" font-weight="bold">mainHeader</text>
<rect x="40" y="149" width="370" height="192" rx="6" fill="#F4E7DB" stroke="#8A6440" stroke-width="1.5" opacity="1"/>
<text x="225.0" y="243.0" font-size="14" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#211A16" text-anchor="middle" font-weight="bold">main content</text>
<text x="225.0" y="263.0" font-size="12" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#566A58" text-anchor="middle" font-weight="normal">↕ scrolls</text>
<rect x="40" y="349" width="370" height="30" rx="6" fill="#FFF8F5" stroke="#8A6440" stroke-width="1.5" stroke-dasharray="6 4" opacity="1"/>
<text x="225.0" y="369.0" font-size="13" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#211A16" text-anchor="middle" font-weight="bold">mainBar</text>
<text x="225" y="450" font-size="1" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#211A16" text-anchor="middle" font-weight="normal"></text>
<text x="675" y="40" font-size="16" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#211A16" text-anchor="middle" font-weight="bold">Empty (null or :empty)</text>
<rect x="470" y="55" width="410" height="380" rx="10" fill="#FFFFFF" stroke="#C4B2A4" stroke-width="2.5" opacity="1"/>
<rect x="490" y="65" width="370" height="360" rx="6" fill="#F4E7DB" stroke="#8A6440" stroke-width="1.5" opacity="1"/>
<text x="675.0" y="243.0" font-size="14" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#211A16" text-anchor="middle" font-weight="bold">main content</text>
<text x="675.0" y="263.0" font-size="12" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#566A58" text-anchor="middle" font-weight="normal">gets all freed space</text>
<line x1="880" y1="66" x2="880" y2="66" stroke="#A67C52" stroke-width="2"/>
<rect x="760" y="54" width="120" height="22" rx="11" fill="#E4C9AE" stroke="#A67C52" stroke-width="1.5" opacity="1"/>
<text x="820" y="69" font-size="11" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#211A16" text-anchor="middle" font-weight="bold">header 0px</text>
<line x1="880" y1="424" x2="880" y2="424" stroke="#A67C52" stroke-width="2"/>
<rect x="760" y="410" width="120" height="22" rx="11" fill="#E4C9AE" stroke="#A67C52" stroke-width="1.5" opacity="1"/>
<text x="820" y="425" font-size="11" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#211A16" text-anchor="middle" font-weight="bold">bars 0px</text>
<text x="450" y="470" font-size="13" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#6B5B50" text-anchor="middle" font-weight="normal">Not rendered when the prop is null, and an empty slot is display:none as a CSS safety net.</text>
<text x="450" y="495" font-size="13" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#6B5B50" text-anchor="middle" font-weight="normal">No hard-coded offsets: no --ab-app-bar-height, no padding-top:64px. The grid row is auto, so empty = 0px.</text>
</svg>
