<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" aria-labelledby="t d" role="img" viewBox="0 0 960 600"><title id="t">Welcome mapped onto the layout rule</title><desc id="d">The Welcome top bar becomes the app header, the slide counter becomes mainHeader, the slide becomes main content, the arrows and Skip become mainBar, and on mobile the globe opens a bottom app-scoped drawer with the languages. Footer and aside are empty and take no space.</desc><defs><marker id="ah" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#D8B085" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="100%" height="100%" fill="#19120C"/><text x="180" y="32" fill="#F4ECE5" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Welcome today</text><text x="700" y="32" fill="#F4ECE5" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Welcome on the layout rule</text><rect width="200" height="520" x="80" y="50" fill="#241A12" stroke="#6B5346" stroke-width="2.5" opacity="1" rx="22"/><rect width="176" height="40" x="92" y="62" fill="#2C2118" stroke="#6B5346" stroke-width="1.5" opacity="1" rx="6"/><text x="180" y="87" fill="#F4ECE5" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">top bar · logo · globe</text><rect width="176" height="30" x="92" y="112" fill="#2C2118" stroke="#6B5346" stroke-width="1.5" opacity="1" rx="6"/><text x="180" y="132" fill="#F4ECE5" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">counter 3 / 9</text><rect width="176" height="300" x="92" y="152" fill="#2C2118" stroke="#6B5346" stroke-width="1.5" opacity="1" rx="6"/><text x="180" y="307" fill="#F4ECE5" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">slide</text><rect width="176" height="40" x="92" y="462" fill="#2C2118" stroke="#6B5346" stroke-width="1.5" opacity="1" rx="6"/><text x="180" y="487" fill="#F4ECE5" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">‹ Skip ›</text><rect width="420" height="520" x="500" y="50" fill="#241A12" stroke="#6B5346" stroke-width="2.5" opacity="1" rx="12"/><rect width="396" height="40" x="512" y="62" fill="#19120C" stroke="#D9AB7F" stroke-dasharray="6 4" stroke-width="1.5" opacity="1" rx="6"/><text x="710" y="87" fill="#F4ECE5" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">app header · AbAppLayout header</text><rect width="396" height="30" x="512" y="112" fill="#19120C" stroke="#D9AB7F" stroke-dasharray="6 4" stroke-width="1.5" opacity="1" rx="6"/><text x="710" y="132" fill="#F4ECE5" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">mainHeader · AbMainLayout mainHeader</text><rect width="396" height="240" x="512" y="152" fill="#2C2118" stroke="#D9AB7F" stroke-width="1.5" opacity="1" rx="6"/><text x="710" y="270" fill="#F4ECE5" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">main content</text><text x="710" y="290" fill="#8FA491" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">slide · ↕ scrolls if tall</text><rect width="396" height="40" x="512" y="402" fill="#19120C" stroke="#D9AB7F" stroke-dasharray="6 4" stroke-width="1.5" opacity="1" rx="6"/><text x="710" y="427" fill="#F4ECE5" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">mainBar · AbMainLayout mainBar</text><rect width="396" height="106" x="512" y="452" fill="#3A2C1F" stroke="#D8B085" stroke-width="2.5" opacity="1" rx="6"/><text x="710" y="510" fill="#F3E6D8" font-family="Roboto,Inter,DejaVu Sans,sans-