<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
<title id="t">Welcome mapped onto the layout rule</title>
<desc id="d">The Welcome top bar becomes the app header, the slide counter becomes mainHeader, the slide becomes main content, the arrows and Skip become mainBar, and on mobile the globe opens a bottom app-scoped drawer with the languages. Footer and aside are empty and take no space.</desc>
