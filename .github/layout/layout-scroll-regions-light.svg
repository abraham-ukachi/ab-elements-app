<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" aria-labelledby="t d" role="img" viewBox="0 0 900 600"><title id="t">What scrolls in the Ab layout</title><desc id="d">The document is locked. Only three regions scroll, each on its own: the sidebar, main content and aside content. The panes row has min-height 0, the app uses 100dvh, header and footer pad with safe-area insets, and every scroller uses overscroll-behavior contain.</desc><defs><marker id="ah" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#A67C52" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="100%" height="100%" fill="#FFF8F5"/><rect width="860" height="60" x="20" y="20" fill="#FFF" stroke="#904A43" stroke-dasharray="6 4" stroke-width="1.5" opacity="1" rx="6"/><text x="450" y="46" fill="#904A43" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">🔒 html, body { overflow:hidden; height:100% } — the document never scrolls</text><text x="450" y="68" fill="#6B5B50" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">no window scroll listeners · no rubber-band of the whole page on iOS</text><rect width="860" height="410" x="20" y="95" fill="#FFF" stroke="#C4B2A4" stroke-width="2.5" opacity="1" rx="12"/><text x="450" y="115" fill="#6B5B50" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">AbAppLayout · grid-template-rows: auto 1fr auto · height:100dvh (fallback 100vh)</text><rect width="820" height="34" x="40" y="125" fill="#FFF8F5" stroke="#8A6440" stroke-dasharray="6 4" stroke-width="1.5" opacity="1" rx="6"/><text x="450" y="147" fill="#211A16" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">header · padding-top: env(safe-area-inset-top)</text><rect width="820" height="262" x="40" y="169" fill="#FBF3EC" stroke="#C4B2A4" stroke-width="1.5" opacity="1" rx="6"/><text x="450" y="186" fill="#6B5B50" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">panes row · min-height:0 (lets children shrink so they can scroll)</text><rect width="150" height="226" x="50" y="194" fill="#F4E7DB" stroke="#8A6440" stroke-width="1.5" opacity="1" rx="6"/><text x="125" y="305" fill="#211A16" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">sidebar</text><text x="125" y="325" fill="#566A58" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">overflow:auto</text><text x="115" y="388" fill="#211A16" font-family="Roboto Mono,DejaVu Sans Mono,monospace" font-size="11" font-weight="normal" text-anchor="middle">overscroll:contain</text><line x1="182" x2="182" y1="240" y2="370" stroke="#A67C52" stroke-width="3" marker-end="url(#ah)"/><line x1="182" x2="182" y1="370" y2="240" stroke="#A67C52" stroke-width="3" marker-end="url(#ah)"/><rect width="380" height="226" x="210" y="194" fill="#F4E7DB" stroke="#8A6440" stroke-width="1.5" opacity="1" rx="6"/><text x="400" y="305" fill="#211A16" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">main content</text><text x="400" y="325" fill="#566A58" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">overflow:auto</text><text x="400" y="388" fill="#211A16" font-family="Roboto Mono,DejaVu Sans Mono,monospace" font-size="11" font-weight="normal" text-anchor="middle">overscroll-behavior:contain</text><line x1="572" x2="572" y1="240" y2="370" stroke="#A67C52" stroke-width="3" marker-end="url(#ah)"/><line x1="572" x2="572" y1="370" y2="240" stroke="#A67C52" stroke-width="3" marker-end="url(#ah)"/><rect width="250" height="226" x="600" y="194" fill="#F4E7DB" stroke="#8A6440" stroke-width="1.5" opacity="1" rx="6"/><text x="725" y="305" fill="#211A16" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="14" font-weight="bold" text-anchor="middle">aside content</text><text x="725" y="325" fill="#566A58" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" text-anchor="middle">overflow:auto</text><text x="725" y="388" fill="#211A16" font-family="Roboto Mono,DejaVu Sans Mono,monospace" font-size="11" font-weight="normal" text-anchor="middle">overscroll-behavior:contain</text><line x1="832" x2="832" y1="240" y2="370" stroke="#A67C52" stroke-width="3" marker-end="url(#ah)"/><line x1="832" x2="832" y1="370" y2="240" stroke="#A67C52" stroke-width="3" marker-end="url(#ah)"/><rect width="820" height="34" x="40" y="441" fill="#FFF8F5" stroke="#8A6440" stroke-dasharray="6 4" stroke-width="1.5" opacity="1" rx="6"/><text x="450" y="463" fill="#211A16" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="13" font-weight="bold" text-anchor="middle">footer · padding-bottom: env(safe-area-inset-bottom)</text><text x="450" y="494" fill="#6B5B50" font-family="Roboto Mono,DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" text-anchor="middle">each pane: min-height:0; overflow:hidden → its content wrapper: overflow:auto; scrollbar-gutter:stable</text><rect width="22" height="16" x="30" y="530" fill="#FFF8F5" stroke="#8A6440" stroke-dasharray="6 4" stroke-width="1.5" opacity="1" rx="3"/><text x="60" y="543" fill="#6B5B50" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" text-anchor="start">slot · 0px when empty</text><rect width="22" height="16" x="245" y="530" fill="#F4E7DB" stroke="#8A6440" stroke-width="1.5" opacity="1" rx="3"/><text x="275" y="543" fill="#6B5B50" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" text-anchor="start">scroller (overflow:auto)</text><rect width="22" height="16" x="460" y="530" fill="#FFF" stroke="#C4B2A4" stroke-width="1.5" opacity="1" rx="3"/><text x="490" y="543" fill="#6B5B50" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" text-anchor="start">fixed box (overflow:hidden)</text><rect width="22" height="16" x="675" y="530" fill="#E4C9AE" stroke="#A67C52" stroke-width="1.5" opacity="1" rx="3"/><text x="705" y="543" fill="#6B5B50" font-family="Roboto,Inter,DejaVu Sans,sans-serif" font-size="12" font-weight="normal" text-anchor="start">drawer</text><text x="450" y="580" fill="#6B5B50" font-family="Roboto Mono,DejaVu Sans Mono,monospace" font-size="12" font-weight="normal" text-anchor="middle">&lt;meta name=&quot;viewport&quot; content=&quot;…, viewport-fit=cover&quot;&gt;</text></svg>