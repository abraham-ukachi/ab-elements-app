<title id="t">Layout at 390, 768, 1180 and 1920 pixels</title>
<desc id="d">At 390 one pane and the aside is a drawer; at 768 the sidebar is a rail and the aside is a right drawer; at 1180 and 1920 the sidebar, main and aside are all visible, with a gap at 1920. The document never scrolls at any width.</desc>
