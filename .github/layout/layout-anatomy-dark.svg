<rect x="675" y="505" width="22" height="16" rx="3" fill="#3A2C1F" stroke="#D8B085" stroke-width="1.5" opacity="1"/>
<text x="705" y="518" font-size="12" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#B5A597" text-anchor="start" font-weight="normal">drawer</text>
<text x="870" y="545" font-size="11" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#B5A597" text-anchor="end" font-weight="normal">AbMainLayout (centre) · AbAsideLayout (right)</text>
