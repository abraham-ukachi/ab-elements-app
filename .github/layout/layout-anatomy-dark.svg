<text x="450.0" y="422.0" font-size="11" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#B5A597" text-anchor="middle" font-weight="normal">app footer · 0px + hidden when empty</text>
<text x="260" y="112" font-size="1" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#F4ECE5" text-anchor="middle" font-weight="normal"></text>
