<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="t d">
<title id="t">The Ab layout rule: anatomy</title>
<desc id="d">AbAppLayout fills 100dvh and never scrolls. Rows: header, then sidebar plus AbMainLayout plus AbAsideLayout, then footer. Main has mainHeader, scrolling content and mainBar; aside has asideHeader, scrolling content and asideBar. Header, footer and bars are 0px and hidden when empty.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D8B085"/></marker></defs>
<rect width="100%" height="100%" fill="#19120C"/>
<text x="450" y="0" font-size="1" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#F4ECE5" text-anchor="middle" font-weight="normal"></text>
<rect x="20" y="20" width="860" height="430" rx="12" fill="#241A12" stroke="#6B5346" stroke-width="2.5" opacity="1"/>
<text x="450.0" y="42" font-size="13" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#B5A597" text-anchor="middle" font-weight="normal">AbAppLayout · height:100dvh · overflow:hidden · the document never scrolls</text>
<rect x="40" y="54" width="820" height="40" rx="6" fill="#19120C" stroke="#D9AB7F" stroke-width="1.5" stroke-dasharray="6 4" opacity="1"/>
<text x="450.0" y="74.0" font-size="13" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#F4ECE5" text-anchor="middle" font-weight="bold">header</text>
<text x="450.0" y="90.0" font-size="11" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#B5A597" text-anchor="middle" font-weight="normal">app header · 0px + hidden when empty</text>
<rect x="40" y="104" width="150" height="272" rx="6" fill="#2C2118" stroke="#6B5346" stroke-width="1.5" opacity="1"/>
<rect x="50" y="114" width="130" height="252" rx="6" fill="#2C2118" stroke="#D9AB7F" stroke-width="1.5" opacity="1"/>
<text x="115.0" y="238.0" font-size="14" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#F4ECE5" text-anchor="middle" font-weight="bold">sidebar</text>
<text x="115.0" y="258.0" font-size="12" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#8FA491" text-anchor="middle" font-weight="normal">↕ scrolls</text>
