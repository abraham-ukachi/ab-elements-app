<text x="388.5" y="139.0" font-size="13" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#F4ECE5" text-anchor="middle" font-weight="bold">mainHeader</text>
<rect x="210" y="164" width="357.0" height="152" rx="6" fill="#2C2118" stroke="#D9AB7F" stroke-width="1.5" opacity="1"/>
<text x="388.5" y="238.0" font-size="14" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#F4ECE5" text-anchor="middle" font-weight="bold">main content</text>
<text x="388.5" y="258.0" font-size="12" font-family="Roboto,Inter,DejaVu Sans,sans-serif" fill="#8FA491" text-anchor="middle" font-weight="normal">↕ scrolls on its own</text>
