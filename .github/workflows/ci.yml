# CI for abElements: lint, typecheck, test & build every pull request and every push to `main`
name: CI

on:
  pull_request:
  push:
    branches: [main]

# the checks only read the repo
permissions:
  contents: read

# one run per pull request (a new push cancels the previous run); runs on `main` are never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # no `version` input: pnpm/action-setup reads the exact version from `packageManager` in package.json
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install the dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # prebuild fails when an installed package version has no released changelog entry.
      # Do not set AB_CHANGELOG_GATE. `warn` is a local review switch and stays off here.
      - name: Build
        run: pnpm build

      # 🛡️ 0.2.26: no eval / new Function in the client bundle (CSP-friendly, live previews included)
      - name: No eval in the client bundle
        run: pnpm check:no-eval
