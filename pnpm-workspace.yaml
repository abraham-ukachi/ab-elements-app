# pnpm 11 settings (the "pnpm" field in package.json is no longer read).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true
# our own Ab packages are trusted, so the EXACT releases we use skip pnpm's minimum release age
# (one `name@version` pin per Ab package, matching package.json & the lockfile; bump the pin with
# the package, and a pin can go once that release is a day old). None right now: every Ab release
# in use is over a day old (0.2.23), so the `minimumReleaseAgeExclude:` list is gone until the next bump
