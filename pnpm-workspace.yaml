# pnpm 11 settings (the "pnpm" field in package.json is no longer read).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
# our own Ab packages are trusted, so an EXACT release we need before it's a day old may skip pnpm's minimum
# release age with a `name@version` pin here (matching package.json & the lockfile, D33); a pin goes once that
# release is a day old ⏳
# 🧹 Nov 4 2026: theme 0.3.9 & components 0.4.1 are > 1 day old, so their pins are gone (list empty again)
# 🧹 components 0.5.0 is no longer locked (0.6.0 replaced it), so its pin is gone
# 🧹 Nov 6 2026: components 0.6.0 is > 1 day old (published 2026-11-04 21:13 Paris, pin expired 2026-11-05 21:13 Paris), so its pin is gone (list empty again)
# 🧹 Nov 12 2026: components 0.7.0 is past a day old (published 2026-11-06 09:40:48.855 Paris,
#    safe to drop at or after 2026-11-07 09:41 Paris), so its pin is gone (list empty again)
# The seven releases below were published 2026-11-12 (Paris, UTC+1). Each pin expires 24h later.
# A minute-only stamp would drop the pin before the release is a full day old.
# core 0.2.4 published 2026-11-12T05:29:35.727Z (06:29:35.727 Paris). Expires 2026-11-13 06:29:35.727 Paris.
# theme 0.3.10 published 2026-11-12T05:29:47.532Z (06:29:47.532 Paris). Expires 2026-11-13 06:29:47.532 Paris.
# fonts 0.2.8 published 2026-11-12T05:30:04.716Z (06:30:04.716 Paris). Expires 2026-11-13 06:30:04.716 Paris.
# components 0.7.1 published 2026-11-12T05:30:35.341Z (06:30:35.341 Paris). Expires 2026-11-13 06:30:35.341 Paris.
# animations 0.2.6 published 2026-11-12T05:30:36.673Z (06:30:36.673 Paris). Expires 2026-11-13 06:30:36.673 Paris.
# icons 0.2.8 published 2026-11-12T05:31:09.969Z (06:31:09.969 Paris). Expires 2026-11-13 06:31:09.969 Paris.
# hooks 0.1.8 published 2026-11-12T05:31:29.486Z (06:31:29.486 Paris). Expires 2026-11-13 06:31:29.486 Paris.
