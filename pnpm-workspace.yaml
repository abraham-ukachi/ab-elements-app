# pnpm 11 settings (the "pnpm" field in package.json is no longer read).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true
# our own Ab packages are trusted, so the EXACT releases we use skip pnpm's minimum release age
# (one `name@version` pin per Ab package, matching package.json & the lockfile; bump the pin with
# the package, and a pin can go once that release is a day old)
minimumReleaseAgeExclude:
  - ab-nextjs-animations@0.2.4
  - ab-nextjs-components@0.1.13 # ⏳ D33: expires 2026-10-21 19:42 Paris (24h after publish)
  - ab-nextjs-core@0.1.6 # ⏳ D33: expires 2026-10-21 19:33 Paris (24h after publish)
  - ab-nextjs-fonts@0.2.6 # ⏳ D33: expires 2026-10-21 19:06 Paris (24h after publish)
  - ab-nextjs-hooks@0.1.7 # ⏳ D33: expires 2026-10-21 19:28 Paris (24h after publish)
  - ab-nextjs-i18n@0.1.0
  - ab-nextjs-icons@0.2.4 # ⏳ D33: expires 2026-10-21 19:15 Paris (24h after publish)
  - ab-nextjs-theme@0.3.4 # ⏳ D33: expires 2026-10-21 19:25 Paris (24h after publish)