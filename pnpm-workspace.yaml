# pnpm 11 settings (the "pnpm" field in package.json is no longer read).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
# our own Ab packages are trusted, so an EXACT release we need before it's a day old may skip pnpm's minimum
# release age with a `name@version` pin here (matching package.json & the lockfile, D33); a pin goes once that
# release is a day old ⏳
# 🧹 Nov 4 2026: theme 0.3.9 & components 0.4.1 are > 1 day old, so their pins are gone (list empty again)
# 🧹 components 0.5.0 is no longer locked (0.6.0 replaced it), so its pin is gone
# 🧹 Nov 6 2026: components 0.6.0 is > 1 day old (published 2026-11-04 21:13 Paris, pin expired 2026-11-05 21:13 Paris), so its pin is gone (list empty again)
# components 0.7.0 published 2026-11-06T08:40:48.855Z (09:40:48.855 Paris, UTC+1).
# The pin expires 24h later, at 2026-11-07 09:40:48.855 Paris. 09:40:00 would be 48.855s early.
# Safe cleanup is at or after 09:41 Paris on 2026-11-07.
minimumReleaseAgeExclude:
  - ab-nextjs-components@0.7.0 # D33: expires 2026-11-07 09:40:48.855 Paris
