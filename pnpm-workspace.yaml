# pnpm 11 settings (the "pnpm" field in package.json is no longer read).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
# our own Ab packages are trusted, so an EXACT release we need before it's a day old may skip pnpm's minimum
# release age with a `name@version` pin here (matching package.json & the lockfile, D33); a pin goes once that
# release is a day old ⏳
# 🎨 theme 0.3.8 (.ab-prose, warning/danger, color-scheme) & 🧩 components 0.4.0 (AbCodeBlock, AbCallout,
# AbContentTabs, AbDocPager), both published 2026-11-03 for the 0.2.24 docs
minimumReleaseAgeExclude:
  - ab-nextjs-theme@0.3.8 # D33: expires 2026-11-04 02:46 Paris
  - ab-nextjs-components@0.4.0 # D33: expires 2026-11-04 02:56 Paris
