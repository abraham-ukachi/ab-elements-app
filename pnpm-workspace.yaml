# pnpm 11 settings (the "pnpm" field in package.json is no longer read).
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true
  unrs-resolver: true
# our own Ab packages are trusted, so the EXACT releases we use skip pnpm's minimum release age
# (one `name@version` pin per Ab package, matching package.json & the lockfile; bump the pin with
# the package, and a pin can go once that release is a day old)
minimumReleaseAgeExclude:
  - ab-nextjs-animations@0.2.5 # ⏳ D33: expires 2026-10-30 23:54 Paris (24h after publish)
  - ab-nextjs-components@0.3.1 # ⏳ D33: expires 2026-10-31 13:06 Paris (24h after publish)
  - ab-nextjs-core@0.2.3 # ⏳ D33: expires 2026-10-31 00:00 Paris (24h after publish)
  - ab-nextjs-icons@0.2.6 # ⏳ D33: expires 2026-10-31 12:52 Paris (24h after publish)
  - ab-nextjs-theme@0.3.7 # ⏳ D33: expires 2026-10-30 23:49 Paris (24h after publish)
